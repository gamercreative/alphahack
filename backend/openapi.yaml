openapi: 3.0.3
info:
  title: Alphahack Agent Backend
  version: 0.1.0
  description: >
    Agents, conversations, messages and agent runs with a tool-call trace.
    Every non-2xx response uses the Error schema.
servers:
  - url: http://localhost:8080

paths:
  /healthz:
    get:
      summary: Liveness and database reachability
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "500": { $ref: "#/components/responses/Error" }

  /v1/agents:
    get:
      summary: List agents (newest first)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      summary: Create an agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateAgent" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }

  /v1/agents/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get an agent
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update an agent (only the fields present are changed)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgent" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Agent" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete an agent and everything under it
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/conversations:
    get:
      summary: List conversations (most recently active first)
      parameters:
        - name: agent_id
          in: query
          schema: { type: string }
          description: Only conversations of this agent
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      summary: Start a conversation with an agent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateConversation" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/conversations/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get a conversation
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conversation" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a conversation with its messages and runs
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }

  /v1/conversations/{id}/messages:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: List messages (oldest first)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Message" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Send a user message and run the agent
      description: >
        Synchronous: stores the user message, runs the agent loop (model calls
        plus tool calls) and returns the assistant reply with the run and its
        tool-call trace. Can take a long time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessage" }
      responses:
        "201":
          description: The agent replied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
        "504": { $ref: "#/components/responses/Error" }

  /v1/conversations/{id}/messages/stream:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Send a user message and stream the agent turn (server-sent events)
      description: |
        Same request as POST /messages, answered as a text/event-stream.
        Errors that happen before the turn starts (bad body, unknown
        conversation) are ordinary JSON errors with their real status.
        Once the stream is open the status is 200 and the events are:

        | event         | data                                                    |
        |---------------|---------------------------------------------------------|
        | `start`       | `{"run": Run, "user_message": Message}`                 |
        | `delta`       | `{"text": "..."}` assistant text chunk                  |
        | `thinking`    | `{"text": "..."}` model reasoning chunk (if exposed)    |
        | `tool_call`   | same shape as `tool_result`, output fields still empty  |
        | `tool_result` | `{"name", "input", "output", "is_error", "duration_ms"}`|
        | `done`        | ChatResult (same body as the non-streaming route)       |
        | `error`       | Error (same body as any other failure); ends the stream |

        Exactly one of `done` or `error` is sent last. Text deltas cover every
        model call of the turn, including text written before tool calls.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessage" }
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/conversations/{id}/runs:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: List runs of a conversation (newest first)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Run" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get a run with its tool calls
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/tools:
    get:
      summary: List the tools the agent can call
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Tool" }

  /api/v1/branches:
    get:
      summary: List pharmacy branches
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Branch" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/branches/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get a pharmacy branch
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Branch" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/branches/{id}/inventory:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: List inventory batches at a branch (FEFO order)
      parameters:
        - name: medication_id
          in: query
          schema: { type: string }
          description: Filter batches by medication ID
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/InventoryBatch" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/medications:
    get:
      summary: List or search medications
      parameters:
        - name: q
          in: query
          schema: { type: string }
          description: Optional search query across brand name, active ingredient and therapeutic class
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Medication" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/medications/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get a medication with live sellable stock per branch
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MedicationDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/customers:
    get:
      summary: List customers
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Error" }

  /api/v1/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get a customer profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      summary: Update a customer profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCustomerInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/customers/{id}/prescriptions:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: List prescriptions for a customer
      parameters:
        - name: status
          in: query
          schema: { type: string }
          description: Filter prescriptions by status
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Prescription" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Upload a new prescription for a customer (status starts as pending)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePrescriptionInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Prescription" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/customers/{id}/refills:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: List chronic refill subscriptions for a customer
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/RefillSubscription" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a chronic refill subscription for a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRefillInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefillSubscription" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/refills/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      summary: Update a refill subscription status
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRefillStatusInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefillSubscription" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/carts:
    post:
      summary: Create or load the active cart for a customer at a branch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCartInput" }
      responses:
        "201":
          description: Created or active cart loaded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/carts/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get a cart with its items and subtotal
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartDetail" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/carts/{id}/items:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Add or update a medication item in the cart with clinical and stock guardrails
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddCartItemInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/carts/{id}/items/{medication_id}:
    parameters:
      - $ref: "#/components/parameters/ID"
      - name: medication_id
        in: path
        required: true
        schema: { type: string }
    delete:
      summary: Remove a medication item from the cart
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CartDetail" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/carts/{id}/checkout:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Atomically checkout a cart with FEFO batch allocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckoutCartInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/customers/{id}/orders:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: List orders for a customer
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/orders/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Get an order with its batch-allocated line items
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderDetail" }
        "404": { $ref: "#/components/responses/Error" }

  # ---- Wassit (medicine availability enquiries). Who may call each route is in its description.
  # Staff = Authorization: Bearer <token>. Agent = Authorization: Agent <AGENT_TOKEN>.
  # Staff-only routes return 403 agent_forbidden to the agent credential. Agent-only routes
  # return 403 forbidden to a staff token. UNDO_WINDOW (default 60s) is the time a queued
  # outbox message can still be cancelled before the target sees it.

  /api/v1/auth/login:
    post:
      summary: Staff login with email and PIN
      description: "Who: public. Returns a staff token valid for 12 hours, sent as 'Authorization: Bearer <token>'. Wrong email or PIN returns 401 unauthorized."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/me:
    get:
      summary: Current staff member and branch
      description: "Who: staff only. An agent token gets 403 agent_forbidden. No token gets 401 unauthorized."
      security: [{ StaffBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  staff: { $ref: "#/components/schemas/Staff" }
                  branch: { $ref: "#/components/schemas/Branch" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries:
    get:
      summary: List enquiries for my branch
      description: "Who: staff only (agent token gets 403 agent_forbidden). scope=outgoing lists enquiries my branch raised; scope=incoming lists enquiries sent to my branch."
      security: [{ StaffBearer: [] }]
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [outgoing, incoming] }
        - name: status
          in: query
          schema:
            type: string
            enum: [open, awaiting_clarification, awaiting_approval, waiting, closed, cancelled]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Enquiry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    post:
      summary: Create an enquiry
      description: "Who: staff only (agent token gets 403 agent_forbidden). handled_by=manual is worked by pharmacists. handled_by=agent queues a wakeup with trigger created for Wassit."
      security: [{ StaffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateEnquiryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enquiry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Enquiry detail with targets, messages, events and run summaries
      description: "Who: staff or agent. Staff sees their own branch's enquiries; the agent sees all enquiries it works on."
      security: [{ StaffBearer: [] }, { AgentToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries/{id}/medication:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Set or change the medication of an enquiry
      description: "Who: staff or agent. The change is logged as medication_set with the previous medication_id as its inverse, so it can be undone."
      security: [{ StaffBearer: [] }, { AgentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MedicationInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enquiry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries/{id}/clarification-request:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Agent asks the requester a clarifying question
      description: "Who: agent only. A staff token gets 403 forbidden. Moves the enquiry to awaiting_clarification. Human clarification counts toward hitl_count."
      security: [{ AgentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClarificationRequestInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enquiry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries/{id}/clarify:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Requester answers the agent's question
      description: "Who: staff, the requester only. An agent token gets 403 agent_forbidden. Moves the enquiry back to open and sets wake trigger clarified."
      security: [{ StaffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClarifyInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enquiry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries/{id}/candidates:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Ranked candidate branches for an enquiry
      description: "Who: staff or agent. Ranked in Go: participating branches other than the requester, with unexpired unrecalled stock at least the quantity preferred, then distance (haversine km) and stock freshness."
      security: [{ StaffBearer: [] }, { AgentToken: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, default: 5 }
        - name: radius_km
          in: query
          schema: { type: number, minimum: 0, default: 15 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Candidate" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries/{id}/targets:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Propose or approve target branches
      description: "Who: staff or agent. A staff call creates targets as approved. An agent call creates targets as proposed and moves the enquiry to awaiting_approval until the requester approves."
      security: [{ StaffBearer: [] }, { AgentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TargetsInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EnquiryTarget" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries/{id}/targets/approve:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Requester approves proposed targets
      description: "Who: staff, the requester only. An agent token gets 403 agent_forbidden. Sets the targets to approved and sets wake trigger approved."
      security: [{ StaffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApproveTargetsInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EnquiryTarget" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries/{id}/send:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Queue the enquiry message to every approved target
      description: "Who: staff or agent. One queued outbox message per approved target, with send_after = now + UNDO_WINDOW (default 60s). Targets become sent and the enquiry becomes waiting. Inside the window the message can be cancelled and the target never sees it."
      security: [{ StaffBearer: [] }, { AgentToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enquiry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/messages/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Cancel a queued outbox message
      description: "Who: staff or agent. Only allowed while the message is queued, which is inside UNDO_WINDOW. Otherwise 409 conflict."
      security: [{ StaffBearer: [] }, { AgentToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboxMessage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/targets/{id}/follow-up:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Send one follow-up to a target
      description: "Who: staff or agent. At most one follow-up per target, and only when the target is sent. Otherwise 409 conflict."
      security: [{ StaffBearer: [] }, { AgentToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryTarget" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/targets/{id}/no-response:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Mark a target as no response
      description: "Who: staff or agent. Only when the target is sent and follow_ups = 1, otherwise 409 conflict. No response is never recorded as unavailable."
      security: [{ StaffBearer: [] }, { AgentToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryTarget" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/inbox:
    get:
      summary: Enquiries waiting for my branch
      description: "Who: staff only (agent token gets 403 agent_forbidden). Targets at my branch whose enquiry message has been sent."
      security: [{ StaffBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/InboxItem" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/targets/{id}/reply:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Target branch replies to an enquiry
      description: "Who: staff at the target branch only. An agent token gets 403 agent_forbidden, so no agent can mark stock available. kind=alternative is shown to the requester as an option and never counts as a match. Sets wake trigger reply."
      security: [{ StaffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplyInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryTarget" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries/{id}/notify:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Queue a notification to the requester
      description: "Who: staff or agent. Creates a notification outbox message to the requester branch."
      security: [{ StaffBearer: [] }, { AgentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotifyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OutboxMessage" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries/{id}/wait:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Agent schedules its next wake-up
      description: "Who: agent only. A staff token gets 403 forbidden. Sets status waiting and next_wake_at. One minute of wait is WAIT_UNIT long (default 1m)."
      security: [{ AgentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WaitInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enquiry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries/{id}/close:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Close an enquiry with an outcome
      description: "Who: staff or agent. The closing rules are enforced in Go. available needs at least one target available. unavailable needs every target replied unavailable. Otherwise use unable_to_confirm or cancelled. A rule violation returns 409 conflict with a message that says what to do next."
      security: [{ StaffBearer: [] }, { AgentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Enquiry" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/events/{id}/undo:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Undo an event by running its stored inverse
      description: "Who: staff or agent. Runs the inverse stored on the event and writes an event_undone row. An undo after send queues a retraction and cancels the target. Returns 409 conflict if the event is not reversible or was already undone."
      security: [{ StaffBearer: [] }, { AgentToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryEvent" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/enquiries/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Live enquiry events (server-sent events)
      description: "Who: staff only (agent token gets 403 agent_forbidden). Streams one event named enquiry_event per new enquiry_events row; the data is an EnquiryEvent as JSON."
      security: [{ StaffBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            text/event-stream:
              schema: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/agent/wakeups:
    get:
      summary: Enquiries the agent should work on now
      description: "Who: agent only. A staff token gets 403 forbidden. Returns agent-handled enquiries with a pending wake trigger, oldest first. The runner polls this every 3 seconds."
      security: [{ AgentToken: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/AgentWakeup" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/agent/runs:
    post:
      summary: Start an agent run record
      description: "Who: agent only. A staff token gets 403 forbidden. Creates a running run for one wake of one enquiry."
      security: [{ AgentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentRunInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryAgentRun" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/agent/runs/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      summary: Finish an agent run
      description: "Who: agent only. A staff token gets 403 forbidden. Stores status, tokens, steps and error. cost_micros is computed in Go from AGENT_PRICE_IN_PER_MTOK and AGENT_PRICE_OUT_PER_MTOK."
      security: [{ AgentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateAgentRunInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryAgentRun" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/agent/runs/{id}/tool-calls:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Record one tool call of an agent run
      description: "Who: agent only. A staff token gets 403 forbidden. Appends to the run trace."
      security: [{ AgentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ToolCallInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryAgentToolCall" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/stats:
    get:
      summary: Per-enquiry outcome, human-in-the-loop count and agent cost
      description: "Who: staff only (agent token gets 403 agent_forbidden). hitl_count counts clarified and targets_approved events that are not undone. cost_micros is in micro-dollars."
      security: [{ StaffBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/EnquiryStat" }
                  totals: { type: object, description: "Totals across data; field names per the handler" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - validation_failed
                - not_found
                - method_not_allowed
                - conflict
                - internal_error
                - upstream_error
                - timeout
            message: { type: string }
            request_id: { type: string }

    ListMeta:
      type: object
      properties:
        limit: { type: integer }
        offset: { type: integer }

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        system_prompt: { type: string }
        model: { type: string, description: Empty means the server default model }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateAgent:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        system_prompt: { type: string, maxLength: 100000 }
        model: { type: string }

    UpdateAgent:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        system_prompt: { type: string, maxLength: 100000 }
        model: { type: string }

    Conversation:
      type: object
      properties:
        id: { type: string }
        agent_id: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateConversation:
      type: object
      required: [agent_id]
      properties:
        agent_id: { type: string }
        title: { type: string, maxLength: 200 }

    Message:
      type: object
      properties:
        id: { type: string }
        conversation_id: { type: string }
        run_id: { type: string, nullable: true }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }

    SendMessage:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 100000 }

    Run:
      type: object
      properties:
        id: { type: string }
        conversation_id: { type: string }
        status: { type: string, enum: [running, completed, failed] }
        stop_reason: { type: string, example: end_turn }
        error: { type: string }
        model: { type: string }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        iterations: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    ToolCall:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        name: { type: string }
        input: { type: object, additionalProperties: true }
        output: { type: string }
        is_error: { type: boolean }
        duration_ms: { type: integer }
        created_at: { type: string, format: date-time }

    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          properties:
            tool_calls:
              type: array
              items: { $ref: "#/components/schemas/ToolCall" }

    ChatResult:
      type: object
      properties:
        user_message: { $ref: "#/components/schemas/Message" }
        assistant_message: { $ref: "#/components/schemas/Message" }
        run: { $ref: "#/components/schemas/Run" }
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ToolCall" }

    Tool:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        input_schema: { type: object, additionalProperties: true }

    Branch:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        address: { type: string }
        phone: { type: string }
        supports_delivery: { type: boolean }
        created_at: { type: string, format: date-time }

    Medication:
      type: object
      properties:
        id: { type: string }
        brand_name: { type: string }
        active_ingredient: { type: string }
        therapeutic_class: { type: string }
        dosage_form:
          type: string
          enum: [tablet, capsule, syrup, inhaler, injection, cream, drops]
        strength: { type: string }
        rx_required: { type: boolean }
        controlled: { type: boolean }
        chronic_eligible: { type: boolean }
        unit_price_cents: { type: integer, format: int64 }
        contraindication_tags:
          type: array
          items: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }

    InventoryBatch:
      type: object
      properties:
        id: { type: string }
        branch_id: { type: string }
        medication_id: { type: string }
        batch_number: { type: string }
        expiry_date: { type: string, format: date-time }
        quantity_on_hand: { type: integer }
        quantity_reserved: { type: integer }
        quantity_available: { type: integer }
        is_recalled: { type: boolean }
        recall_reason: { type: string }
        updated_at: { type: string, format: date-time }

    BranchStockSummary:
      type: object
      properties:
        branch_id: { type: string }
        branch_name: { type: string }
        city: { type: string }
        available_quantity: { type: integer }
        earliest_expiry: { type: string, format: date-time, nullable: true }

    MedicationDetail:
      type: object
      properties:
        medication: { $ref: "#/components/schemas/Medication" }
        branch_availability:
          type: array
          items: { $ref: "#/components/schemas/BranchStockSummary" }

    Customer:
      type: object
      properties:
        id: { type: string }
        full_name: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        allergies:
          type: array
          items: { type: string }
        chronic_conditions:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    UpdateCustomerInput:
      type: object
      properties:
        full_name: { type: string }
        phone: { type: string }
        email: { type: string }
        address: { type: string }
        allergies:
          type: array
          items: { type: string }
        chronic_conditions:
          type: array
          items: { type: string }

    Prescription:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        medication_id: { type: string }
        doctor_name: { type: string }
        dosage_instructions: { type: string }
        allowed_refills: { type: integer }
        remaining_refills: { type: integer }
        status:
          type: string
          enum: [pending, verified, rejected, expired]
        notes: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }

    CreatePrescriptionInput:
      type: object
      required: [medication_id, doctor_name, dosage_instructions, allowed_refills, expires_at]
      properties:
        medication_id: { type: string }
        doctor_name: { type: string }
        dosage_instructions: { type: string }
        allowed_refills: { type: integer }
        notes: { type: string }
        expires_at: { type: string, format: date-time }

    Cart:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        branch_id: { type: string }
        status:
          type: string
          enum: [active, checked_out, abandoned]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CartItem:
      type: object
      properties:
        id: { type: string }
        cart_id: { type: string }
        medication_id: { type: string }
        prescription_id: { type: string, nullable: true }
        quantity: { type: integer }
        unit_price_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    CartDetail:
      type: object
      properties:
        cart: { $ref: "#/components/schemas/Cart" }
        items:
          type: array
          items: { $ref: "#/components/schemas/CartItem" }
        subtotal_cents: { type: integer, format: int64 }

    CreateCartInput:
      type: object
      required: [customer_id, branch_id]
      properties:
        customer_id: { type: string }
        branch_id: { type: string }

    AddCartItemInput:
      type: object
      required: [medication_id, quantity]
      properties:
        medication_id: { type: string }
        prescription_id: { type: string, nullable: true }
        quantity: { type: integer, minimum: 1 }

    CheckoutCartInput:
      type: object
      required: [fulfillment_type]
      properties:
        fulfillment_type:
          type: string
          enum: [pickup, delivery]
        delivery_address: { type: string }

    Order:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        branch_id: { type: string }
        cart_id: { type: string, nullable: true }
        status:
          type: string
          enum: [pending_rx, confirmed, ready_for_pickup, out_for_delivery, completed, cancelled]
        fulfillment_type:
          type: string
          enum: [pickup, delivery]
        delivery_address: { type: string }
        total_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OrderItem:
      type: object
      properties:
        id: { type: string }
        order_id: { type: string }
        medication_id: { type: string }
        batch_id: { type: string }
        quantity: { type: integer }
        unit_price_cents: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    OrderDetail:
      type: object
      properties:
        order: { $ref: "#/components/schemas/Order" }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }

    RefillSubscription:
      type: object
      properties:
        id: { type: string }
        customer_id: { type: string }
        medication_id: { type: string }
        branch_id: { type: string }
        prescription_id: { type: string, nullable: true }
        interval_days: { type: integer }
        next_refill_at: { type: string, format: date-time }
        status:
          type: string
          enum: [active, paused, cancelled]
        created_at: { type: string, format: date-time }

    CreateRefillInput:
      type: object
      required: [medication_id, branch_id, interval_days]
      properties:
        medication_id: { type: string }
        branch_id: { type: string }
        prescription_id: { type: string, nullable: true }
        interval_days: { type: integer, minimum: 1 }
        next_refill_at: { type: string, format: date-time, nullable: true }

    UpdateRefillStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, paused, cancelled]

    # ---- Wassit ----
    LoginInput:
      type: object
      required: [email, pin]
      properties:
        email: { type: string, format: email }
        pin: { type: string, example: "1234" }

    LoginResult:
      type: object
      required: [token, staff, branch]
      properties:
        token:
          type: string
          description: "30 random bytes, hex. Stored hashed on the server. Valid for 12 hours."
        staff: { $ref: "#/components/schemas/Staff" }
        branch: { $ref: "#/components/schemas/Branch" }

    Staff:
      type: object
      properties:
        id: { type: string }
        branch_id: { type: string }
        full_name: { type: string }
        email: { type: string, format: email }
        role: { type: string, example: pharmacist }
        created_at: { type: string, format: date-time }

    Enquiry:
      type: object
      properties:
        id: { type: string }
        requester_branch_id: { type: string }
        requester_staff_id: { type: string }
        raw_request: { type: string }
        medication_id: { type: string, nullable: true }
        quantity: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [open, awaiting_clarification, awaiting_approval, waiting, closed, cancelled]
        outcome:
          type: string
          enum: ["", available, unavailable, unable_to_confirm, cancelled]
        outcome_branch_id: { type: string, nullable: true }
        handled_by:
          type: string
          enum: [manual, agent]
        clarification_question: { type: string }
        clarification_answer: { type: string }
        wake_trigger:
          type: string
          description: Set on created, clarified, approved or reply for agent enquiries; cleared when a run starts
        next_wake_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        closed_at: { type: string, format: date-time, nullable: true }

    EnquiryDetail:
      allOf:
        - $ref: "#/components/schemas/Enquiry"
        - type: object
          properties:
            targets:
              type: array
              items: { $ref: "#/components/schemas/EnquiryTarget" }
            messages:
              type: array
              items: { $ref: "#/components/schemas/OutboxMessage" }
            events:
              type: array
              items: { $ref: "#/components/schemas/EnquiryEvent" }
            runs:
              type: array
              description: Run summaries
              items: { $ref: "#/components/schemas/EnquiryAgentRun" }

    EnquiryTarget:
      type: object
      properties:
        id: { type: string }
        enquiry_id: { type: string }
        branch_id: { type: string }
        status:
          type: string
          enum: [proposed, approved, sent, available, unavailable, alternative_offered, no_response, cancelled]
        reply_quantity: { type: integer, nullable: true }
        reply_text: { type: string }
        replied_by_staff_id: { type: string, nullable: true }
        replied_at: { type: string, format: date-time, nullable: true }
        follow_ups: { type: integer, minimum: 0, maximum: 1 }
        created_at: { type: string, format: date-time }

    OutboxMessage:
      type: object
      properties:
        id: { type: string }
        enquiry_id: { type: string }
        target_id: { type: string, nullable: true }
        kind:
          type: string
          enum: [enquiry, follow_up, retraction, notification]
        body: { type: string }
        status:
          type: string
          enum: [queued, sent, cancelled]
        send_after: { type: string, format: date-time }
        sent_at: { type: string, format: date-time, nullable: true }
        created_by_actor:
          type: string
          description: "For example staff:<id>, agent or system"
        created_at: { type: string, format: date-time }

    EnquiryEvent:
      type: object
      properties:
        id: { type: string }
        seq: { type: integer, format: int64 }
        enquiry_id: { type: string }
        actor_type:
          type: string
          enum: [staff, agent, system]
        actor_id: { type: string }
        type:
          type: string
          enum:
            - enquiry_created
            - medication_set
            - clarification_requested
            - clarified
            - targets_proposed
            - targets_approved
            - messages_queued
            - message_cancelled
            - message_sent
            - follow_up_queued
            - marked_no_response
            - reply_received
            - requester_notified
            - wait_set
            - enquiry_closed
            - event_undone
        payload: { type: object, additionalProperties: true }
        inverse:
          type: object
          nullable: true
          additionalProperties: true
          description: Stored inverse; null when the event is not reversible
        undone_at: { type: string, format: date-time, nullable: true }
        undone_by_event_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    EnquiryAgentRun:
      type: object
      properties:
        id: { type: string }
        enquiry_id: { type: string }
        trigger:
          type: string
          enum: [created, clarified, approved, reply, timer]
        model: { type: string }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        steps: { type: integer, minimum: 0 }
        cost_micros: { type: integer, format: int64, description: Micro-dollars }
        status:
          type: string
          enum: [running, completed, failed]
        error: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    EnquiryAgentToolCall:
      type: object
      properties:
        id: { type: string }
        seq: { type: integer, format: int64 }
        run_id: { type: string }
        name: { type: string }
        input: { type: object, additionalProperties: true }
        output: { type: string }
        is_error: { type: boolean }
        duration_ms: { type: integer, minimum: 0 }
        created_at: { type: string, format: date-time }

    Candidate:
      type: object
      properties:
        branch_id: { type: string }
        name: { type: string }
        city: { type: string }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        available_quantity:
          type: integer
          description: Sum of quantity_on_hand minus quantity_reserved over unrecalled, unexpired batches; 0 if none
        stock_updated_at: { type: string, format: date-time, nullable: true }

    InboxItem:
      type: object
      properties:
        target_id: { type: string }
        target_status:
          type: string
          enum: [sent, available, unavailable, alternative_offered, no_response, cancelled, approved, proposed]
        follow_ups: { type: integer, minimum: 0, maximum: 1 }
        enquiry_id: { type: string }
        requester_branch_id: { type: string }
        requester_branch_name: { type: string }
        medication_id: { type: string, nullable: true }
        medication_name:
          type: string
          description: "Brand strength form, empty string if no medication is set"
        raw_request: { type: string }
        quantity: { type: integer, minimum: 1 }
        sent_at: { type: string, format: date-time, nullable: true }

    AgentWakeup:
      type: object
      properties:
        enquiry_id: { type: string }
        trigger:
          type: string
          enum: [created, clarified, approved, reply, timer]

    EnquiryStat:
      type: object
      properties:
        enquiry_id: { type: string }
        raw_request: { type: string }
        handled_by:
          type: string
          enum: [manual, agent]
        status: { type: string }
        outcome: { type: string }
        hitl_count:
          type: integer
          minimum: 0
          description: Count of clarified and targets_approved events that are not undone
        agent_runs: { type: integer, minimum: 0 }
        agent_steps: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        cost_micros: { type: integer, format: int64, description: Micro-dollars }
        created_at: { type: string, format: date-time }

    CreateEnquiryInput:
      type: object
      required: [raw_request, quantity, handled_by]
      properties:
        raw_request: { type: string, minLength: 1 }
        medication_id: { type: string, nullable: true }
        quantity: { type: integer, minimum: 1 }
        handled_by:
          type: string
          enum: [manual, agent]

    MedicationInput:
      type: object
      required: [medication_id]
      properties:
        medication_id: { type: string }

    ClarificationRequestInput:
      type: object
      required: [question]
      properties:
        question: { type: string, minLength: 1 }

    ClarifyInput:
      type: object
      required: [answer]
      properties:
        answer: { type: string, minLength: 1 }

    TargetsInput:
      type: object
      required: [branch_ids]
      properties:
        branch_ids:
          type: array
          minItems: 1
          items: { type: string }

    ApproveTargetsInput:
      type: object
      required: [target_ids]
      properties:
        target_ids:
          type: array
          minItems: 1
          items: { type: string }

    ReplyInput:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [available, unavailable, alternative]
        quantity: { type: integer, minimum: 0 }
        text: { type: string }

    NotifyInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1 }

    WaitInput:
      type: object
      required: [minutes]
      properties:
        minutes:
          type: integer
          enum: [5, 15, 30]

    CloseInput:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [available, unavailable, unable_to_confirm, cancelled]
        branch_id: { type: string, nullable: true, description: Required for available, the branch that has the stock }

    AgentRunInput:
      type: object
      required: [enquiry_id, trigger, model]
      properties:
        enquiry_id: { type: string }
        trigger:
          type: string
          enum: [created, clarified, approved, reply, timer]
        model: { type: string }

    UpdateAgentRunInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [running, completed, failed]
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        steps: { type: integer, minimum: 0 }
        error: { type: string }

    ToolCallInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        input: { type: object, additionalProperties: true }
        output: { type: string }
        is_error: { type: boolean }
        duration_ms: { type: integer, minimum: 0 }

  securitySchemes:
    StaffBearer:
      type: http
      scheme: bearer
      description: "Staff token from POST /api/v1/auth/login, sent as 'Authorization: Bearer <token>'."
    AgentToken:
      type: apiKey
      in: header
      name: Authorization
      description: "Agent credential, sent as 'Authorization: Agent <AGENT_TOKEN>'. A staff-only route answers it with 403 agent_forbidden."
