                        items: { $ref: "#/components/schemas/GovProduct" }
        "400": { $ref: "#/components/responses/Error" }
    post:
      summary: Staff adds a reference product
      description: "Who: staff only (agent token gets 403 agent_forbidden). 409 conflict when the code, or the same brand + ingredient + strength + form, already exists. 400 when document_id is not an uploaded reference document."
      security: [{ StaffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGovProductInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GovProduct" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/reference/documents:
    get:
      summary: List uploaded reference documents, newest first
      description: "Who: staff only (agent token gets 403 agent_forbidden)."
      security: [{ StaffBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ReferenceDocument" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Staff uploads a reference document (PDF, PNG or JPEG, max 10 MB)
      description: "Who: staff only (agent token gets 403 agent_forbidden). The content type is sniffed from the bytes; a file whose declared type differs from its content, or that is not PDF/PNG/JPEG, gets 400 validation_failed. Stored under UPLOAD_DIR/reference/<id><ext> with its sha256. No automatic parsing: a reviewer adds rows with POST /api/v1/reference/products."
      security: [{ StaffBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document: { type: string, format: binary }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferenceDocument" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/client/auth/login:
    post:
      summary: DOSYN client login (phone + PIN)
      description: "Who: public. Returns a client token (12h) for 'Authorization: Bearer <token>'. Client tokens get 403 forbidden on staff and agent routes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, pin]
              properties:
                phone: { type: string, example: "+96170000000" }
                pin: { type: string, example: "1234" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClientLoginResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/v1/client/me:
    get:
      summary: The calling client
      description: "Who: client only (staff -> 403 forbidden, agent -> 403 agent_forbidden)."
      security: [{ ClientBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  client: { $ref: "#/components/schemas/ClientView" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/v1/client/tickets:
    get:
      summary: The client's own tickets, newest first
      description: "Who: client only."
      security: [{ ClientBearer: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, reserved, closed] } }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/TicketSummary" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Open a ticket (one medicine, quantity 1..10, a fixed pickup window)
      description: "Who: client only. In one transaction: a client-desk enquiry (requester DOSYN client desk, handled_by agent, wake 'created') whose raw_request is built only from catalogue fields ('need {brand} {strength} {form} x{qty}, pickup {window}'), the ticket (mode once) and an enquiry_created event (actor client). pickup_window must be one of the listed values (free text could carry client data)."
      security: [{ ClientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTicketInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketView" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/client/tickets/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Ticket detail with the thread and the best offer
      description: "Who: the ticket's client (anyone else: 404). thread rows are built in Go from events, outbox messages, targets, offers (dose check from the offer_decided payload) and package photos. working = enquiry open and no target yet or one still proposed/approved/sent. best_offer is computed by the rules (rule 11) or null."
      security: [{ ClientBearer: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/client/tickets/{id}/stream:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: Live ticket thread (server-sent events)
      description: "Who: the ticket's client; EventSource may pass ?access_token=<client token>. Sends every thread row, then each new row as an event named ticket_event (data = ThreadRow). The computed best_offer row gets a new id whenever its content changes."
      security: [{ ClientBearer: [] }]
      responses:
        "200":
          description: text/event-stream
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/client/tickets/{id}/reserve:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Reserve at a pharmacy with a verified offer
      description: "Who: the ticket's client. 409 unless the branch has a verified offer (rules match + verified package photo). Closes the enquiry available at that branch (amended rule 6), queues a hold notification to that pharmacy ('Please hold ... for a DOSYN client until ...'), marks the ticket reserved; events actor client."
      security: [{ ClientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id]
              properties:
                branch_id: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketView" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/client/schedules:
    get:
      summary: The client's medicine schedules
      description: "Who: client only."
      security: [{ ClientBearer: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ListMeta"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      summary: Create a medicine schedule
      description: "Who: client only. next_run_at = the next weekday 09:00 Asia/Beirut. Each cycle opens one ticket (mode scheduled, wake 'scheduled'); no_bulk: cycles are never merged."
      security: [{ ClientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateScheduleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/client/schedules/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    patch:
      summary: Pause or resume a schedule
      description: "Who: the schedule's client. Resuming after next_run_at passed moves it to the next weekday 09:00."
      security: [{ ClientBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [active, paused] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/v1/client/schedules/{id}/run:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Run this cycle now
      description: "Who: the schedule's client. Opens the cycle's ticket (mode scheduled, wake 'scheduled') and moves next_run_at to the next cycle (+7 / +14 / +28 days). 409 while a ticket of this schedule is still open (no bulk). A background scheduler (SCHEDULE_INTERVAL, default 30s) does the same for due active schedules."
      security: [{ ClientBearer: [] }]
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketView" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/targets/{id}/photos:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Target pharmacist uploads a package photo and types its code and expiry
      description: "Who: staff at the target branch only (agent -> 403 agent_forbidden, other staff/clients -> 403 forbidden); the target must have replied available or alternative. JPEG/PNG, max 5 MB, sniffed. Go decides (rule 10): code = gov code of the offered product (a rules-accepted equivalent's gov_code, else the enquiry medication's reference row) and expiry_month >= pickup month -> verified; a known gov code of another product, or expiry before pickup -> mismatch; code missing/unknown or expiry missing -> flagged (reviewer). Events photo_uploaded (staff) + photo_checked (system/rules); agent enquiries get wake_trigger 'photo'. Stored under UPLOAD_DIR/photos."
      security: [{ StaffBearer: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary }
                code: { type: string, example: "6280000000001" }
                expiry_month: { type: string, example: "2027-08", description: "YYYY-MM or MM/YYYY" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/photos/{id}/agent-reading:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: The agent's reading of a package photo (the rules still decide)
      description: "Who: agent only (staff/clients -> 403 forbidden). Stored on the photo. Reading agrees with the typed code and expiry and confidence >= 0.6 -> the rules' verdict on the typed values; otherwise flagged for a reviewer. 409 after a human review. Events photo_read (agent) + photo_checked (system/rules)."
      security: [{ AgentToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AgentReadingInput" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/photos/{id}/review:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      summary: Reviewer decides a photo (decided_by human)
      description: "Who: staff with role reviewer only (others -> 403 forbidden, agent -> 403 agent_forbidden). Event photo_reviewed; agent enquiries get wake_trigger 'photo'."
      security: [{ StaffBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [verified, rejected] }
                note: { type: string, maxLength: 300 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/v1/photos/{id}/file:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      summary: The photo image
      description: "Who: staff of the target or requester pharmacy, a reviewer, the agent (agent enquiries) or the ticket's client; anyone else gets 404."
      security: [{ StaffBearer: [] }, { AgentToken: [] }, { ClientBearer: [] }]
      responses:
        "200":
          description: Image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Offset:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              enum:
                - bad_request
                - validation_failed
                - not_found
                - method_not_allowed
                - conflict
                - internal_error
                - upstream_error
                - timeout
                - unauthorized
                - forbidden
                - agent_forbidden
                - content_filtered
            message: { type: string }
            request_id: { type: string }

    ListMeta:
      type: object
      properties:
        limit: { type: integer }
        offset: { type: integer }

    Agent:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        system_prompt: { type: string }
        model: { type: string, description: Empty means the server default model }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateAgent:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        system_prompt: { type: string, maxLength: 100000 }
        model: { type: string }

    UpdateAgent:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        system_prompt: { type: string, maxLength: 100000 }
        model: { type: string }

    Conversation:
      type: object
      properties:
        id: { type: string }
        agent_id: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CreateConversation:
      type: object
      required: [agent_id]
      properties:
        agent_id: { type: string }
        title: { type: string, maxLength: 200 }

    Message:
      type: object
      properties:
        id: { type: string }
        conversation_id: { type: string }
        run_id: { type: string, nullable: true }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        created_at: { type: string, format: date-time }

    SendMessage:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 100000 }

    Run:
      type: object
      properties:
        id: { type: string }
        conversation_id: { type: string }
        status: { type: string, enum: [running, completed, failed] }
        stop_reason: { type: string, example: end_turn }
        error: { type: string }
        model: { type: string }
        input_tokens: { type: integer, format: int64 }
        output_tokens: { type: integer, format: int64 }
        iterations: { type: integer }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }

    ToolCall:
      type: object
      properties:
        id: { type: string }
        run_id: { type: string }
        name: { type: string }
        input: { type: object, additionalProperties: true }
        output: { type: string }
        is_error: { type: boolean }
        duration_ms: { type: integer }
        created_at: { type: string, format: date-time }

    RunDetail:
      allOf:
        - $ref: "#/components/schemas/Run"
        - type: object
          properties:
            tool_calls:
              type: array
              items: { $ref: "#/components/schemas/ToolCall" }

    ChatResult:
      type: object
      properties:
        user_message: { $ref: "#/components/schemas/Message" }
        assistant_message: { $ref: "#/components/schemas/Message" }
        run: { $ref: "#/components/schemas/Run" }
        tool_calls:
          type: array
          items: { $ref: "#/components/schemas/ToolCall" }

    Tool:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        input_schema: { type: object, additionalProperties: true }

    Branch:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        city: { type: string }
        address: { type: string }
        phone: { type: string }
        supports_delivery: { type: boolean }
        created_at: { type: string, format: date-time }

    Medication:
      type: object
      properties:
        id: { type: string }
        brand_name: { type: string }
        active_ingredient: { type: string }
        therapeutic_class: { type: string }
        dosage_form:
          type: string
          enum: [tablet, capsule, syrup, inhaler, injection, cream, drops]
        strength: { type: string }
        rx_required: { type: boolean }
        controlled: { type: boolean }
        chronic_eligible: { type: boolean }
        unit_price_cents: { type: integer, format: int64 }
        contraindication_tags:
          type: array
          items: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }

    GovProduct:
      type: object
      required: [code, reg_no, brand_name, ingredient, strength, dosage_form, official_price_cents, source, document_id, created_at]
      properties:
        code: { type: string, pattern: "^[0-9]{13}$" }
        reg_no: { type: string }
        brand_name: { type: string }
        ingredient: { type: string, description: "Combined ingredients joined with /" }
        strength: { type: string, example: 1000mg }
        dosage_form: { type: string, example: tablet }
        official_price_cents: { type: integer, format: int64, minimum: 0 }
        source: { type: string, example: "Demo seed, not real MoPH data" }
        document_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    CreateGovProductInput:
      type: object
      additionalProperties: false
      required: [code, reg_no, brand_name, ingredient, strength, dosage_form, official_price_cents]
      properties:
        code: { type: string, pattern: "^[0-9]{13}$" }
        reg_no: { type: string, maxLength: 200 }
        brand_name: { type: string, maxLength: 200 }
        ingredient: { type: string, maxLength: 200 }
        strength: { type: string, maxLength: 200 }
        dosage_form: { type: string, maxLength: 200, description: "Stored lowercased" }
        official_price_cents: { type: integer, format: int64, minimum: 0 }
        source: { type: string, maxLength: 200, description: "Default 'Staff entry'" }
        document_id: { type: string, nullable: true, description: "An uploaded reference document" }

    ReferenceDocument:
      type: object
      required: [id, name, content_type, size_bytes, sha256, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        content_type: { type: string, enum: [application/pdf, image/png, image/jpeg] }
        size_bytes: { type: integer, format: int64 }
        sha256: { type: string, description: "Hex sha256 of the stored file" }
        created_at: { type: string, format: date-time }

    SetStockInput:
      type: object
      additionalProperties: false
      required: [quantity_on_hand]
      properties:
        quantity_on_hand: { type: integer, minimum: 0, maximum: 1000000 }

    ClientView:
      type: object
      properties:
        id: { type: string }
        display_name: { type: string }

    ClientLoginResult:
      type: object
      properties:
        token: { type: string, description: "starts with c_" }
        client: { $ref: "#/components/schemas/ClientView" }

    PickupWindow:
      type: string
      enum: ["Today before 18:00", "Tomorrow morning", "Within 2 days", "Same day before 18:00", "Same day after 18:00", "Next morning"]

    CreateTicketInput:
      type: object
      additionalProperties: false
      required: [medication_id, quantity, pickup_window]
      properties:
        medication_id: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 10 }
        pickup_window: { $ref: "#/components/schemas/PickupWindow" }

    TicketMedication:
      type: object
      properties:
        id: { type: string }
        brand_name: { type: string }
        active_ingredient: { type: string }
        strength: { type: string }
        dosage_form: { type: string }
        unit_price_cents: { type: integer, format: int64 }

    TicketView:
      type: object
      properties:
        id: { type: string }
        client_id: { type: string }
        enquiry_id: { type: string }
        schedule_id: { type: string, nullable: true }
        mode: { type: string, enum: [once, scheduled] }
